  <style>
    :root {
      --photo-bg: #0f1b2f;
      --photo-glow: #c98b32;
    }

    /* Aviation page uses wider inner-page */
    .inner-page { max-width: 1100px; }

    /* =========================
       Hero Slideshow
       ========================= */
    .aviation-hero {
      position: relative;
      margin: 22px 0 30px;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16 / 8;
      background: var(--photo-bg);
      border: 1px solid rgba(64,118,172,.16);
      box-shadow: 0 20px 45px rgba(20,44,77,.15);
    }
    .aviation-hero-track { position: relative; width: 100%; height: 100%; }
    .aviation-hero-slide {
      position: absolute; inset: 0; margin: 0;
      opacity: 0; visibility: hidden;
      transition: opacity .9s ease-in-out, visibility 0s linear .9s;
    }
    .aviation-hero-slide.is-active {
      opacity: 1; visibility: visible;
      transition: opacity .9s ease-in-out, visibility 0s;
    }
    .aviation-hero-slide img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .aviation-hero-slide figcaption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 46px 24px 20px;
      color: #fff;
      font-weight: 700; font-size: .98rem; letter-spacing: .02em;
      background: linear-gradient(180deg, rgba(6,14,24,0) 0%, rgba(6,14,24,.72) 100%);
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .aviation-hero-dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 2;
    }
    .aviation-hero-dots button {
      width: 10px; height: 10px; padding: 0; border: none;
      border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.42);
      transition: background .25s ease, transform .25s ease;
    }
    .aviation-hero-dots button:hover { background: rgba(255,255,255,.72); }
    .aviation-hero-dots button[aria-selected="true"] {
      background: #fff; transform: scale(1.35);
    }
    @media (max-width: 640px) {
      .aviation-hero { aspect-ratio: 4 / 3; }
      .aviation-hero-slide figcaption { font-size: .88rem; padding: 40px 16px 16px; }
    }
    [data-theme="dark"] .aviation-hero {
      border-color: var(--border);
      box-shadow: 0 20px 45px rgba(0,0,0,.5);
    }

    /* =========================
       Split-flap Stats Board
       ========================= */
    /* a departure board is dark in any theme, so these colors are fixed rather than tokens */
    .flap-board {
      display: none; margin: 26px 0 4px; padding: 16px 22px 18px;
      border-radius: 18px; background: linear-gradient(180deg, #1a1e24 0%, #121519 100%);
      box-shadow: 0 18px 40px rgba(10,16,26,.28), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .flap-board.is-ready { display: block; }
    .flap-board { container-type: inline-size; }
    @media (max-width: 640px) { .flap-board { padding: 14px 14px 16px; } }
    .flap-board-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: #f5b82e;
    }
    /* every flap is sized off the board width, so the full row always fits without scrolling */
    .flap-table {
      --chars: 57; --cols: 5; --cg: 2px; --colgap: 12px;
      --fs: min(18px, calc((100cqw - (var(--cols) - 1) * var(--colgap) - var(--chars) * var(--cg)) / var(--chars) / .9));
    }
    .flap-cols, .flap-row { display: flex; gap: var(--colgap); }
    .flap-cols { margin-bottom: 8px; }
    .flap-cols span {
      flex: none; width: calc(var(--n) * (var(--fs) * .9 + var(--cg)) - var(--cg));
      font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8d97a3;
      white-space: nowrap;
    }
    .flap-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .flap-row {
      width: 100%; padding: 3px 0; border: 0; border-radius: 6px; cursor: pointer;
      background: none; text-align: left; transition: background .18s ease;
    }
    .flap-row:hover, .flap-row:focus-visible { background: rgba(245,184,46,.08); }
    .flap-row:focus-visible { outline: 2px solid #f5b82e; outline-offset: 2px; }
    .flap-col { display: flex; gap: var(--cg); flex: none; width: calc(var(--n) * (var(--fs) * .9 + var(--cg)) - var(--cg)); perspective: 200px; }
    .flap {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: calc(var(--fs) * .9); height: calc(var(--fs) * 1.45); border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs); font-weight: 700; line-height: 1; white-space: pre;
      color: #f4f0e4; background: linear-gradient(180deg, #2c3139 0%, #262a31 50%, #1f2329 50%, #1b1e23 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .flap::after {
      content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 1px; background: rgba(0,0,0,.65);
    }
    .flap-row .flap-col:nth-child(2) .flap { color: #f5b82e; }
    .flap-space { visibility: hidden; }
    .flap.flip-a { animation: flap-a 75ms ease-in; }
    .flap.flip-b { animation: flap-b 75ms ease-in; }
    @keyframes flap-a { 50% { transform: rotateX(70deg); filter: brightness(.6); } }
    @keyframes flap-b { 50% { transform: rotateX(70deg); filter: brightness(.6); } }
    @container (max-width: 640px) {
      .flap-table { --chars: 24; --cols: 3; --colgap: 8px; }
      .flap-wide { display: none !important; }
    }

    /* =========================
       Boarding Pass (lightbox details)
       ========================= */
    .lightbox-info.is-pass { width: 340px; padding: 0; background: none; box-shadow: none; overflow-y: auto; }
    .pass {
      color: #1c2733; font-size: .8rem;
      filter: drop-shadow(0 18px 36px rgba(0,0,0,.4));
    }
    /* the notches are cut with masks so they show whatever is behind the pass */
    .pass-main, .pass-stub {
      background: #fbf8f1;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-size: 51% 100%; mask-size: 51% 100%;
    }
    .pass-main {
      padding: 16px 18px 14px; border-radius: 14px 14px 0 0;
      -webkit-mask-image: radial-gradient(circle at 0 100%, transparent 9px, #000 9.5px), radial-gradient(circle at 100% 100%, transparent 9px, #000 9.5px);
      mask-image: radial-gradient(circle at 0 100%, transparent 9px, #000 9.5px), radial-gradient(circle at 100% 100%, transparent 9px, #000 9.5px);
      -webkit-mask-position: left, right; mask-position: left, right;
    }
    .pass-stub {
      padding: 14px 18px 16px; border-radius: 0 0 14px 14px;
      border-top: 2px dashed rgba(28,39,51,.22);
      background: #f3eee2;
      -webkit-mask-image: radial-gradient(circle at 0 0, transparent 9px, #000 9.5px), radial-gradient(circle at 100% 0, transparent 9px, #000 9.5px);
      mask-image: radial-gradient(circle at 0 0, transparent 9px, #000 9.5px), radial-gradient(circle at 100% 0, transparent 9px, #000 9.5px);
      -webkit-mask-position: left, right; mask-position: left, right;
    }
    .pass-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(28,39,51,.12);
    }
    .pass-airline { font-weight: 800; font-size: .92rem; color: #163453; }
    .pass-kind {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #b07a1f;
      white-space: nowrap;
    }
    .pass-route, .pass-plane { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .pass-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .pass-right { text-align: right; }
    .pass-label {
      font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #7b8794;
    }
    .pass-value { font-weight: 700; color: #1c2733; }
    .pass-code-wrap { display: flex; flex-direction: column; }
    .pass-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 2.1rem; font-weight: 800; line-height: 1.05; letter-spacing: .02em; color: #163453;
    }
    .pass-code-sub { font-size: .7rem; color: #5d6a78; }
    .pass-reg .pass-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.05rem; letter-spacing: .04em; color: #163453;
    }
    .pass-reg-line { display: block; white-space: nowrap; }
    .pass-plane .pass-field:last-child { text-align: right; }
    .pass-sub {
      margin: 10px 0 4px; font-size: .62rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #b07a1f;
    }
    .pass-rows {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0;
      padding-top: 10px; border-top: 1px solid rgba(28,39,51,.1); font-size: .76rem;
    }
    .pass-sub + .pass-rows { padding-top: 4px; border-top: none; }
    .pass-rows dt { color: #7b8794; font-weight: 700; }
    .pass-rows dd { margin: 0; color: #1c2733; }
    .pass-exposure { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px; }
    .pass-exposure .pass-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; }
    .pass-kit { margin: 10px 0 0; font-size: .7rem; color: #5d6a78; }
    .pass-barcode-row { margin-top: 12px; }
    .pass-barcode { display: block; max-width: 100%; height: 40px; margin: 0 auto; fill: #111; }
    .pass-barcode-text {
      display: block; margin-top: 4px; text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .64rem; letter-spacing: .3em; color: #5d6a78; white-space: pre;
    }
    .lightbox-dialog.info-open .lightbox-body .lightbox-image:has(+ .is-pass) { max-width: calc(min(1200px, 92vw) - 356px); }
    @media (max-width: 800px) {
      .lightbox-info.is-pass { width: min(100%, 420px); }
      .lightbox-dialog.info-open .lightbox-body .lightbox-image:has(+ .is-pass) { max-width: 100%; }
    }

    /* =========================
       Search & Filter
       ========================= */
    .photo-filter {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      margin: 18px 0 4px;
    }
    .photo-search {
      flex: 1 1 280px; min-width: 0; padding: 10px 14px; border-radius: 12px;
      font: inherit; font-size: .92rem; color: var(--text);
      background: var(--surface-alt); border: 1px solid rgba(64,118,172,.22);
    }
    .photo-search:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    .photo-filter-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .photo-filter-chips button {
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: .82rem; font-weight: 600;
      color: #1c3550; background: #fff; border: 1px solid rgba(64,118,172,.22);
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .photo-filter-chips button:hover { background: #eef5ff; }
    .photo-filter-chips button[aria-pressed="true"] { color: #fff; background: var(--primary-deep); border-color: var(--primary-deep); }
    .photo-filter-count { flex-basis: 100%; margin: 0; min-height: 1em; font-size: .8rem; color: var(--muted); }
    .photo-filter-count:empty { display: none; }
    .photo-filter-empty { margin: 18px 0; padding: 18px; border-radius: 14px; text-align: center; color: var(--muted); background: var(--surface-alt); }
    .photo-card[hidden], .airport-section[hidden] { display: none !important; }
    .page-toc-link.is-empty, .airport-links a.is-empty { opacity: .4; }
    .photo-card { scroll-margin-top: calc(var(--nav-offset) + 16px); }
    .spotted-link { color: var(--primary-deep); font-weight: 700; text-decoration: none; border-bottom: 1px dotted currentColor; }
    .spotted-link:hover { border-bottom-style: solid; }
    .pass-rows .spotted-link { color: #163453; }

    /* =========================
       Airport Sections
       ========================= */
    /* one swipeable row instead of a wrapped block, so the buttons don't push the photos down on narrow screens */
    .airport-links {
      display: flex; flex-wrap: nowrap; gap: 10px; margin: 8px -2px -8px; padding: 8px 2px 18px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
    }
    .airport-links::-webkit-scrollbar { display: none; }
    .airport-links .resource-btn { flex: none; white-space: nowrap; }
    /* the side index takes over once there's room for it */
    @media (min-width: 1500px) { .airport-links { display: none; } }
    .airport-section {
      margin-top: 34px; padding: 28px; border-radius: 20px;
      background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 45%, #fffaf1 100%);
      border: 1px solid rgba(64,118,172,.16);
      box-shadow: 0 14px 34px rgba(20,44,77,.08);
    }
    .airport-section { scroll-margin-top: calc(var(--nav-offset) + 16px); }
    .airport-header { display: flex; align-items: flex-end; margin-bottom: 18px; }
    .airport-name { margin: 0; color: #163453; }
    .airport-meta { margin: 0; color: var(--muted); font-style: italic; }
    .airport-description { margin: 0 0 18px; }

    /* =========================
       Photo Grid
       ========================= */
    .photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
    .photo-card {
      overflow: hidden; border-radius: 16px; background: #fff;
      border: 1px solid rgba(64,118,172,.12);
      box-shadow: 0 10px 24px rgba(20,44,77,.08);
    }
    .photo-frame { position: relative; overflow: hidden; }
    .photo-frame.placeholder-photo {
      aspect-ratio: 4 / 3;
      background:
        radial-gradient(circle at 70% 22%, rgba(245,214,146,.95) 0 9%, rgba(245,214,146,0) 26%),
        linear-gradient(180deg, #071729 0%, #18395c 48%, #6b87a7 100%);
    }
    .photo-frame.placeholder-photo::before {
      content: ""; position: absolute; inset: auto -10% 0; height: 36%;
      background: linear-gradient(180deg, rgba(8,18,32,0) 0%, rgba(11,20,35,.78) 100%);
    }
    .photo-frame.placeholder-photo::after {
      content: ""; position: absolute; right: 14%; bottom: 20%; width: 42%; height: 10%;
      border-radius: 999px 999px 45% 45%;
      background: linear-gradient(90deg, rgba(255,255,255,.92) 0%, rgba(238,244,249,.9) 78%, rgba(194,214,228,.9) 100%);
      box-shadow: -85px 9px 0 -28px rgba(255,255,255,.86), 74px 4px 0 -30px rgba(255,255,255,.82), -24px -28px 0 -30px rgba(255,255,255,.88);
      transform: rotate(-8deg);
    }
    .photo-frame.real-photo { aspect-ratio: auto; display: block; background: #0f1b2f; }
    .photo-frame.real-photo::before, .photo-frame.real-photo::after { content: none; }
    .photo-image { width: 100%; height: auto; display: block; cursor: zoom-in; }
    .photo-card:nth-child(2) .photo-frame.placeholder-photo {
      background:
        radial-gradient(circle at 26% 18%, rgba(255,199,146,.92) 0 10%, rgba(255,199,146,0) 28%),
        linear-gradient(180deg, #151d30 0%, #59466b 52%, #d6a773 100%);
    }
    .photo-card:nth-child(3) .photo-frame.placeholder-photo {
      background:
        radial-gradient(circle at 58% 20%, rgba(230,244,255,.92) 0 11%, rgba(230,244,255,0) 26%),
        linear-gradient(180deg, #091421 0%, #24405c 46%, #7aa3c7 100%);
    }
    .photo-body { padding: 16px 16px 18px; }
    .photo-title { margin: 0 0 6px; color: #163453; font-size: 1.02rem; }
    .photo-caption { margin: 0; color: var(--muted); font-size: .96rem; }
    .photo-date { margin: 2px 0 0; color: var(--muted); font-size: .82rem; font-style: italic; letter-spacing: .04em; }
    .photo-aircraft { margin: -2px 0 8px; color: var(--text); font-size: .9rem; font-weight: 600; }
    .photo-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    /* negative margin cancels the row gap the empty break item would add */
    .tag-break { flex-basis: 100%; height: 0; margin-top: -6px; }
    .reg-chip, .livery-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      font-size: .76rem; line-height: 1.5;
    }
    .reg-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700; letter-spacing: .04em;
      color: #163453; background: #e6eef8;
      border: 1px solid rgba(64,118,172,.22);
    }
    .livery-tag {
      font-weight: 600; color: #7a4f12;
      background: #fff3df; border: 1px solid rgba(201,139,50,.3);
    }

    /* =========================
       Portfolio CTA & Lightbox
       ========================= */
    .portfolio-note {
      margin-top: 26px; padding: 16px 18px;
      border-left: 4px solid var(--photo-glow); border-radius: 12px;
      background: #fff8ed; color: #5c4630;
    }
    .portfolio-cta { margin-top: 28px; display: flex; justify-content: center; }
    .instagram-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 22px; border-radius: 999px;
      font-family: 'Open Sans', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
      font-size: 15px; font-weight: 700; color: #fff; text-decoration: none;
      background: linear-gradient(135deg, #d88a4a 0%, #e8c37a 18%, #bf5f8b 52%, #765292 78%, #5d69b5 100%);
      box-shadow: 0 14px 28px rgba(118,82,146,.2);
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .instagram-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(118,82,146,.24); filter: saturate(1.03); }
    .instagram-btn i { font-size: 18px; }

    .lightbox {
      position: fixed; inset: 0; z-index: 2000;
      display: none; align-items: center; justify-content: center;
      padding: 28px; background: rgba(6,14,24,.88); backdrop-filter: blur(6px);
    }
    .lightbox.is-open { display: flex; }
    .lightbox-dialog {
      position: relative; max-width: min(1200px, 92vw); max-height: 92vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .lightbox-caption {
      margin: 14px 0 0; max-width: 100%;
      color: #e8eef5; font-size: .92rem; font-weight: 600;
      text-align: center; letter-spacing: .02em;
    }
    .lightbox-image {
      max-width: 100%; max-height: calc(92vh - 52px); display: block;
      border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.38); background: #0f1b2f;
    }
    .lightbox-close {
      position: absolute; top: -14px; right: -14px;
      width: 42px; height: 42px; border: none; border-radius: 999px;
      color: #fff; background: rgba(12,22,36,.82);
      box-shadow: 0 12px 26px rgba(0,0,0,.28); cursor: pointer; font-size: 22px; line-height: 1;
    }
    .lightbox-close:hover { background: rgba(24,41,66,.96); }
    /* the pass panel uses filter, which stacks it above an unlayered close button */
    .lightbox-close { z-index: 3; }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border: none; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: rgba(12,22,36,.7); cursor: pointer; z-index: 2;
      box-shadow: 0 12px 26px rgba(0,0,0,.28); transition: background .2s ease;
    }
    .lightbox-nav:hover { background: rgba(24,41,66,.95); }
    .lightbox-prev { left: 18px; }
    .lightbox-next { right: 18px; }
    .lightbox-nav .icon { width: 20px; height: 20px; fill: currentColor; }
    .lightbox-prev .icon { transform: rotate(-90deg); }
    .lightbox-next .icon { transform: rotate(90deg); }
    @media (max-width: 560px) {
      .lightbox-nav { width: 40px; height: 40px; }
      .lightbox-prev { left: 6px; }
      .lightbox-next { right: 6px; }
    }

    /* =========================
       Responsive (page-specific)
       ========================= */
    @media (max-width: 900px) {
      .photo-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 640px) {
      .airport-section { padding: 22px 18px; }
      .photo-grid { grid-template-columns: 1fr; }
    }

    /* =========================
       Dark Theme Overrides
       ========================= */
    [data-theme="dark"] .airport-section {
      background: linear-gradient(135deg, #17202d 0%, #1a2637 45%, #2a2620 100%);
      border-color: var(--border);
      box-shadow: 0 14px 34px rgba(0,0,0,.4);
    }
    [data-theme="dark"] .airport-name { color: #e8eef5; }
    [data-theme="dark"] .photo-search { border-color: var(--border); }
    [data-theme="dark"] .photo-filter-chips button { color: var(--text); background: var(--surface-alt); border-color: var(--border); }
    [data-theme="dark"] .photo-filter-chips button:hover { background: #223145; }
    [data-theme="dark"] .photo-filter-chips button[aria-pressed="true"] { color: #0f1b2f; background: var(--primary-deep); border-color: var(--primary-deep); }
    [data-theme="dark"] .airport-meta { color: var(--muted); }
    [data-theme="dark"] .photo-card {
      background: var(--surface-alt);
      border-color: var(--border);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    [data-theme="dark"] .photo-title { color: #e8eef5; }
    [data-theme="dark"] .photo-caption { color: var(--muted); }
    [data-theme="dark"] .reg-chip {
      color: #d7e6f7; background: rgba(110,166,220,.14);
      border-color: rgba(110,166,220,.3);
