    <script>
      (function () {
        var lightbox = document.getElementById("photo-lightbox");
        if (!lightbox) return;
        var lightboxImage = lightbox.querySelector(".lightbox-image");
        var lightboxCaption = lightbox.querySelector(".lightbox-caption");
        var closeBtn = lightbox.querySelector(".lightbox-close");
        var prevBtn = lightbox.querySelector(".lightbox-prev");
        var nextBtn = lightbox.querySelector(".lightbox-next");
        var dialog = lightbox.querySelector(".lightbox-dialog");
        var info = lightbox.querySelector(".lightbox-info");
        var infoToggle = lightbox.querySelector(".lightbox-info-toggle");
        var infoOpen = true;
        var photoImages = Array.prototype.slice.call(document.querySelectorAll(".photo-image"));
        var current = -1;
        var lastFocused = null;

        function srcFor(img) { return img.dataset.full || img.currentSrc || img.src; }

        function preload(i) {
          if (i < 0 || i >= photoImages.length) return;
          var im = new Image();
          im.src = srcFor(photoImages[i]);
        }

        function captionFor(img) {
          var card = img.closest(".photo-card");
          if (!card) return "";
          var parts = [];
          [".photo-title", ".photo-aircraft", ".reg-chip", ".photo-date"].forEach(function (sel) {
            card.querySelectorAll(sel).forEach(function (el) {
              var text = el.textContent.trim();
              if (text) parts.push(text);
            });
          });
          return parts.join(" · ");
        }

        function render() {
          var img = photoImages[current];
          lightboxImage.src = srcFor(img);
          lightboxImage.alt = img.alt || "";
          if (lightboxCaption) {
            lightboxCaption.textContent = captionFor(img);
            lightboxCaption.hidden = !lightboxCaption.textContent;
          }
          renderInfo(img);
          preload(current + 1);
          preload(current - 1);
        }

        function renderInfo(img) {
          if (!info) return;
          var card = img.closest(".photo-card, .scene-card");
          var details = card && card.querySelector(".exif-details");
          var asPass = !!details && info.dataset.variant === "pass" && card.classList.contains("photo-card");
          info.innerHTML = "";
          info.classList.toggle("is-pass", asPass);
          if (asPass) {
            info.appendChild(buildPass(card, details));
          } else if (details) {
            Array.prototype.forEach.call(details.children, function (el) {
              if (el.tagName !== "SUMMARY") info.appendChild(el.cloneNode(true));
            });
          }
          infoToggle.hidden = !details;
          setInfo(infoOpen);
        }

        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text != null) node.textContent = text;
          return node;
        }

        function field(label, value, cls) {
          var box = el("div", "pass-field" + (cls ? " " + cls : ""));
          box.appendChild(el("span", "pass-label", label));
          if (typeof value === "string") box.appendChild(el("span", "pass-value", value));
          else box.appendChild(value);
          return box;
        }

        // bar widths come from the registration's character codes, so each airframe gets a stable pattern
        function barcode(seed) {
          var ns = "http://www.w3.org/2000/svg";
          var svg = document.createElementNS(ns, "svg");
          var x = 0;
          for (var i = 0; i < seed.length; i++) {
            var code = seed.charCodeAt(i) * 7 + i * 13;
            for (var b = 0; b < 4; b++) {
              var w = 1 + ((code >> (b * 2)) & 3);
              if (b % 2 === 0) {
                var r = document.createElementNS(ns, "rect");
                r.setAttribute("x", x);
                r.setAttribute("width", w);
                r.setAttribute("height", 40);
                svg.appendChild(r);
              }
              x += w;
            }
          }
          svg.setAttribute("viewBox", "0 0 " + x + " 40");
          svg.setAttribute("preserveAspectRatio", "none");
          svg.setAttribute("class", "pass-barcode");
          svg.setAttribute("aria-hidden", "true");
          return svg;
        }

        function readGroups(details) {
          var groups = [];
          Array.prototype.forEach.call(details.querySelectorAll(".exif-group"), function (head) {
            var list = head.nextElementSibling;
            var rows = [];
            if (list) list.querySelectorAll("li").forEach(function (li) {
              rows.push({ key: li.querySelector(".exif-key").textContent, val: li.querySelector(".exif-val").textContent });
            });
            groups.push({ name: head.textContent.trim(), rows: rows });
          });
          return groups;
        }

        function buildPass(card, details) {
          var text = function (sel) { var n = card.querySelector(sel); return n ? n.textContent.trim() : ""; };
          var section = card.closest(".airport-section");
          var regs = Array.prototype.map.call(card.querySelectorAll(".reg-chip"), function (n) { return n.textContent.trim(); });
          var groups = readGroups(details);
          var aircraft = groups.filter(function (g) { return g.name.indexOf("Aircraft") === 0; });
          var photo = groups.filter(function (g) { return g.name === "Photo"; })[0] || { rows: [] };
          var shot = {};
          photo.rows.forEach(function (r) { shot[r.key] = r.val; });

          var pass = el("div", "pass");
          var main = el("div", "pass-main");
          var head = el("div", "pass-head");
          head.appendChild(el("span", "pass-airline", text(".photo-title")));
          head.appendChild(el("span", "pass-kind", "Boarding pass"));
          main.appendChild(head);

          var route = el("div", "pass-route");
          var at = el("div", "pass-code-wrap");
          at.appendChild(el("span", "pass-code", section ? section.dataset.code : ""));
          at.appendChild(el("span", "pass-code-sub", section ? section.dataset.codeSub : ""));
          route.appendChild(field("Spotted at", at));
          route.appendChild(field("Date", text(".photo-date"), "pass-right"));
          main.appendChild(route);

          var plane = el("div", "pass-plane");
          var regList = el("span", "pass-value");
          (regs.length ? regs : ["—"]).forEach(function (r) { regList.appendChild(el("span", "pass-reg-line", r)); });
          plane.appendChild(field(regs.length > 1 ? "Registrations" : "Registration", regList, "pass-reg"));
          // non-breaking hyphens keep "747-8" from splitting across lines in the narrow column
          plane.appendChild(field("Type", text(".photo-aircraft").replace(/-/g, "\u2011")));
          main.appendChild(plane);

          var multi = aircraft.length > 1;
          aircraft.forEach(function (g) {
            var rows = g.rows.filter(function (r) { return multi || (r.key !== "Registration" && r.key !== "Type"); });
            if (!rows.length) return;
            if (multi) main.appendChild(el("p", "pass-sub", g.name.replace(/^Aircraft\s*·\s*/, "")));
            var list = el("dl", "pass-rows");
            rows.forEach(function (r) {
              list.appendChild(el("dt", null, r.key));
              list.appendChild(el("dd", null, r.val));
            });
            main.appendChild(list);
          });
          pass.appendChild(main);

          var stub = el("div", "pass-stub");
          var exp = el("div", "pass-exposure");
          [["Focal", "Focal"], ["Aperture", "Aperture"], ["Shutter", "Shutter"], ["ISO", "ISO"]].forEach(function (k) {
            exp.appendChild(field(k[0], shot[k[1]] || "—"));
          });
          stub.appendChild(exp);
          var kit = [shot.Camera, shot.Lens].filter(Boolean).join(" · ");
          if (kit) stub.appendChild(el("p", "pass-kit", kit));
          var code = el("div", "pass-barcode-row");
          code.appendChild(barcode((regs[0] || text(".photo-title")) + text(".photo-date")));
          code.appendChild(el("span", "pass-barcode-text", (regs[0] || "") + "  " + text(".photo-date").replace(/-/g, "")));
          stub.appendChild(code);
          pass.appendChild(stub);
          return pass;
        }

        // each open starts with details showing; closing them only lasts until the lightbox is dismissed
        function setInfo(open) {
          infoOpen = open;
          var shown = open && !infoToggle.hidden;
          info.hidden = !shown;
          infoToggle.setAttribute("aria-expanded", shown ? "true" : "false");
          dialog.classList.toggle("info-open", shown);
        }

        function openLightbox(i) {
          current = i;
          infoOpen = true;
          lastFocused = document.activeElement;
          render();
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }

        function closeLightbox() {
          lightbox.classList.remove("is-open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImage.removeAttribute("src");
          lightboxImage.alt = "";
          document.body.style.overflow = "";
          var toFocus = photoImages[current] || lastFocused;
          if (toFocus && toFocus.focus) toFocus.focus();
        }

        function move(delta) {
          if (current < 0) return;
          current = (current + delta + photoImages.length) % photoImages.length;
          render();
        }

        photoImages.forEach(function (image, i) {
          image.setAttribute("tabindex", "0");
          image.setAttribute("role", "button");
          image.addEventListener("click", function () { openLightbox(i); });
          image.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openLightbox(i);
            }
          });
        });

        closeBtn.addEventListener("click", closeLightbox);
        prevBtn.addEventListener("click", function () { move(-1); });
        nextBtn.addEventListener("click", function () { move(1); });
        if (infoToggle) infoToggle.addEventListener("click", function () { setInfo(!infoOpen); });

        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", function (event) {
          if (!lightbox.classList.contains("is-open")) return;
          if (event.key === "Escape") {
            closeLightbox();
          } else if (event.key === "ArrowRight") {
            move(1);
          } else if (event.key === "ArrowLeft") {
            move(-1);
          } else if ((event.key === "i" || event.key === "I") && infoToggle && !infoToggle.hidden) {
            setInfo(!infoOpen);
          } else if (event.key === "Tab") {
            var focusables = [prevBtn, closeBtn, nextBtn];
            if (infoToggle && !infoToggle.hidden) focusables.splice(2, 0, infoToggle);
            var idx = focusables.indexOf(document.activeElement);
            if (idx === -1) idx = 0;
            event.preventDefault();
            var nextIdx = event.shiftKey
              ? (idx - 1 + focusables.length) % focusables.length
              : (idx + 1) % focusables.length;
            focusables[nextIdx].focus();
          }
        });
      })();
    </script>
